   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111827" x="7.2" y="16.077487" transform="rotate(-0 7.2 16.077487)">Fig. 2 — Persistence: 16 top-level collections, their keys and what references them</text>
   </g>
   <g id="text_2">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="7.2" y="252.268857" transform="rotate(-0 7.2 252.268857)">Every collection is top-level (no department sub-collections), so scoping is a query-time predicate. ⚠ marks a reference held by display name instead of id.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f46e5" x="23.2704" y="43.01957" transform="rotate(-0 23.2704 43.01957)">IDENTITY &amp; ACCESS</text>
   </g>
   <g id="text_4">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111827" x="29.52" y="50.22819" transform="rotate(-0 29.52 50.22819)">departments   ·   uid · code (8 chars, unique) · hod_id · is_hod</text>
   </g>
   <g id="text_5">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(29.52 69.18867)">users   ·   key = uid · email normalised · hashed_password · role</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(29.52 76.39917)">(10 values) · department_id · status PENDING|ACTIVE</text>
   </g>
   <g id="text_6">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(29.52 88.14915)">join_requests   ·   faculty_id · department_id · department_code</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(29.52 95.4159)">status Pending/Approved/Rejected</text>
   </g>
   <g id="text_7">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111827" x="29.52" y="107.17638" transform="rotate(-0 29.52 107.17638)">settings   ·   key = uid · 4 booleans (stored, never read — §6.4)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 4.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(23.2704 114.710618)">referenced by: users.department_id → departments.uid · join_requests.approval writes</text>
    <text style="font-size: 4.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(23.2704 121.310618)">department_id + status ACTIVE in one update · get_current_user re-checks it (read-repair)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0ea5e9" x="242.0064" y="43.020047" transform="rotate(-0 242.0064 43.020047)">COORDINATION (the workflow core)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 50.75994)">events   ·   12 schema fields · date stored ISO · status 4-state flow</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 57.42819)">⚠ person (display name) · reminded_at · overdue_notified_at</text>
   </g>
   <g id="text_11">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 69.18867)">tasks   ·   17 fields · subtasks[] · progress · require_approval · goal_id</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 76.38867)">assigned_id (+ ⚠ assigned name fallback) · ai_priority_score unused</text>
   </g>
   <g id="text_12">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 88.14915)">task_requests   ·   requester_id · reviewed_by · created_task_id · rejection_reason</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 95.392275)">status PENDING/APPROVED/REJECTED/CANCELLED</text>
   </g>
   <g id="text_13">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 107.17638)">approvals   ·   requested · assigned (both ⚠ names) · priority</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 114.30963)">status Pending/Approved/Rejected · reviewed_at</text>
   </g>
   <g id="text_14">
    <text style="font-size: 4.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(242.0064 114.710618)">referenced by: task_requests.created_task_id → tasks · tasks.goal_id → department_goals</text>
    <text style="font-size: 4.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(242.0064 121.310618)">events.reminded_at is the idempotence marker for the scheduler · decision writes a notification</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b45309" x="23.2704" y="162.76997" transform="rotate(-0 23.2704 162.76997)">TASK DETAIL &amp; AUDIT</text>
   </g>
   <g id="text_16">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111827" x="29.52" y="169.97859" transform="rotate(-0 29.52 169.97859)">task_comments   ·   task_id · author_id/name · content · mentions[]</text>
   </g>
   <g id="text_17">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111827" x="29.52" y="188.93907" transform="rotate(-0 29.52 188.93907)">task_attachments   ·   task_id · file_name/type/size · storage_path · uploaded_by</text>
   </g>
   <g id="text_18">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(29.52 207.89955)">files   ·   safe_filename (uuid prefix) · file_path under ./uploads</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(29.52 215.1663)">the bytes live on the API host, not in Firestore</text>
   </g>
   <g id="text_19">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(29.52 226.86003)">activity_logs   ·   user_id/name · action · category · details · timestamp</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(29.52 234.06003)">written only by create_task — read as the latest 5</text>
   </g>
   <g id="text_20">
    <text style="font-size: 4.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(23.2704 234.522205)">gates: comments/attachments check the caller is the task's assignee or the desk · task access</text>
    <text style="font-size: 4.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(23.2704 241.061017)">is validated per request (validate_task_access) rather than by a query filter</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #059669" x="242.0064" y="162.76997" transform="rotate(-0 242.0064 162.76997)">DELIVERY &amp; GOALS</text>
   </g>
   <g id="text_22">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 169.97859)">notifications   ·   user_id = uid or 'department' · title · message · type</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 177.17859)">priority · target_route · icon · is_read · status</text>
   </g>
   <g id="text_23">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 188.93907)">department_goals   ·   owner_id · title · description · category · start/target date</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 196.096695)">status NOT_STARTED/…</text>
   </g>
   <g id="text_24">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 207.89955)">goal_milestones   ·   goal_id · order · due_date · status PENDING/IN_PROGRESS/DONE</text>
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(248.256 215.09955)">completed_at (full CRUD in the API, read-only in the UI)</text>
   </g>
   <g id="text_25">
    <text style="font-size: 4.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111827" x="248.256" y="226.92678" transform="rotate(-0 248.256 226.92678)">test   ·   one probe document for POST /test/firebase</text>
   </g>
   <g id="text_26">
    <text style="font-size: 4.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(242.0064 234.461017)">audience rule: GET /notifications streams user_id ∈ { own uid , 'department' } — the shared</text>
    <text style="font-size: 4.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(242.0064 241.122205)">channel is a literal document field, so read state on it is shared by the department</text>
   </g>
  </g>
 </g>
 <defs>
